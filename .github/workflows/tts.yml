name: Auto TTS

on:
  push:
    paths:
      - 'src/content/vocabulary/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sinh audio cho từ vựng chưa có audio
        run: node scripts/tts.mjs

      - name: Commit audio + cập nhật JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Không có audio mới cần sinh."
          else
            git commit -m "🔊 Auto-generate audio cho từ vựng mới"
            git push
          fi
